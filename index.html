<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Finanzas Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent: #00ff88;
            --danger: #ff0066;
            --silver-text: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
        }
        body.light {
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            transition: background 0.4s ease;
        }
        .container { width: 100%; max-width: 1000px; }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 10px 18px; border-radius: 12px; color: var(--text-main);
            cursor: pointer; backdrop-filter: blur(10px);
            font-family: 'Space Grotesk'; font-weight: 600; z-index: 100;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .glass-panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            text-align: center;
        }
        .stat-label { font-family: 'Space Grotesk'; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-value { font-size: 2.1rem; font-weight: 800; letter-spacing: -1px; }

        /* tipo de cambio */
        .tc-bar {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 28px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 20px;
            backdrop-filter: blur(10px);
        }
        .tc-bar label { font-family: 'Space Grotesk'; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); }
        .tc-bar input {
            background: rgba(240,208,96,0.08); border: 1px solid rgba(240,208,96,0.25);
            border-radius: 10px; color: #f0d060; text-align: center;
            padding: 8px 14px; font-size: 1rem; font-weight: 800; width: 130px;
            outline: none; font-family: 'Inter', sans-serif;
        }
        .tc-bar span { font-size: 0.75rem; color: var(--text-muted); font-family: 'Space Grotesk'; }

        /* CARRUSEL */
        .carousel-section { width: 100%; }
        .carousel-wrapper { position: relative; width: 100%; overflow: hidden; padding: 10px 0 20px; }
        .carousel-track {
            display: flex; gap: 24px;
            cursor: grab; user-select: none;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            padding: 10px 4px 10px;
        }
        .carousel-track.grabbing { cursor: grabbing; transition: none; }
        .card-unit {
            flex: 0 0 calc(50% - 12px);
            min-width: 420px;
            display: flex; flex-direction: column; gap: 20px;
        }
        @media (max-width: 850px) {
            .card-unit { flex: 0 0 85vw; min-width: 0; }
        }
        .carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .dot {
            width: 8px; height: 8px; border-radius: 99px;
            background: var(--glass-border); border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer; transition: all 0.3s ease;
        }
        .dot.active { width: 24px; background: var(--accent); box-shadow: 0 0 8px rgba(0,255,136,0.5); border-color: var(--accent); }
        .carousel-arrows { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
        .arrow-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text-main); width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); transition: background 0.2s, border-color 0.2s;
        }
        .arrow-btn:hover { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.4); }
        .arrow-btn:disabled { opacity: 0.3; cursor: default; }

        /* TARJETAS */
        .visual-card {
            width: 100%; aspect-ratio: 1.58 / 1;
            border-radius: 22px; padding: 25px;
            position: relative; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-chile { background: linear-gradient(135deg, #1e1e1e 0%, #000000 100%); border: 1px solid rgba(255,255,255,0.1); }
        .chile-logo { font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.5rem; background: var(--silver-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-tenpo { background: radial-gradient(circle at top right, #35e38e 0%, #2ecc71 40%, #1b8a53 100%); }
        .card-tenpo::after { content: ""; position: absolute; top: -10%; right: -10%; width: 100%; height: 120%; background-image: repeating-radial-gradient(circle at 90% 10%, transparent 0, transparent 15px, rgba(255,255,255,0.06) 16px, rgba(255,255,255,0.06) 17px); }
        .tenpo-logo { font-weight: 900; font-style: italic; font-size: 2.1rem; color: white; letter-spacing: -1.5px; }

        /* Black Internacional */
        .card-intl {
            background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 50%, #091525 100%);
            border: 1px solid rgba(180,160,80,0.3);
        }
        .card-intl::before {
            content: ''; position: absolute; top: -40%; right: -20%;
            width: 70%; height: 120%;
            background: radial-gradient(ellipse, rgba(180,140,40,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .card-intl::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; top: 0;
            background: repeating-linear-gradient(-45deg, transparent, transparent 30px, rgba(180,140,40,0.015) 30px, rgba(180,140,40,0.015) 31px);
            pointer-events: none;
        }
        .intl-logo { font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.5rem; background: linear-gradient(180deg, #f0d060 0%, #b8860b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .intl-badge { font-size: 0.5rem; letter-spacing: 3px; font-family: 'Space Grotesk'; font-weight: 700; color: rgba(200,170,60,0.9); background: rgba(180,140,40,0.12); border: 1px solid rgba(180,140,40,0.25); padding: 3px 8px; border-radius: 4px; }
        .usd-tag { position: absolute; top: 25px; right: 25px; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; color: rgba(200,170,60,0.8); font-family: 'Space Grotesk'; }

        .chip { width: 48px; height: 36px; background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%); border-radius: 7px; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); z-index: 2; }
        .cupo-visual-container { z-index: 5; margin-top: 10px; }
        .cupo-bar-bg { height: 10px; background: rgba(0,0,0,0.3); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .cupo-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #facc15, #f87171); transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .card-inner-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; z-index: 5; }
        .inner-group label { font-size: 0.55rem; text-transform: uppercase; color: rgba(255,255,255,0.6); display: block; margin-bottom: 3px; font-weight: 700; }
        .inner-group input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: white; padding: 8px; font-size: 1.1rem; font-weight: 800; width: 100%; outline: none; font-family: 'Inter', sans-serif; }

        .info-panel { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px; backdrop-filter: blur(20px); }
        .info-row { display: flex; justify-content: space-between; align-items: center; }
        .info-row label { font-family: 'Space Grotesk'; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
        .info-row input { background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--accent); text-align: right; padding: 10px; font-size: 1.2rem; font-weight: 800; width: 150px; outline: none; font-family: 'Inter', sans-serif; }
        .progress-bar-payment { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill-payment { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; }
        .bottom-stats { display: flex; justify-content: space-between; align-items: center; }
        .mini-stat span { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .mini-stat b { font-family: 'Space Grotesk'; font-size: 1.3rem; }
        .needed { color: var(--danger); }
        .ready  { color: var(--accent); }
        .intl-input { color: #f0d060 !important; }

        /* fila conversión en panel intl */
        .conv-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px;
            border-top: 1px solid rgba(180,140,40,0.15);
        }
        .conv-row label { font-family: 'Space Grotesk'; font-weight: 500; font-size: 0.85rem; color: rgba(240,208,96,0.7); }
        .conv-val { font-family: 'Inter'; font-size: 1.15rem; font-weight: 800; color: #f0d060; }
    </style>
</head>
<body id="b">
    <button class="theme-toggle" onclick="toggleT()">🌓 MODO TEMA</button>

    <div class="container">

        <!-- Dashboard resumen -->
        <div class="summary-grid">
            <div class="glass-panel">
                <div class="stat-label">Deuda Total (CLP)</div>
                <div id="total-d" class="stat-value" style="color: var(--danger);">$0</div>
            </div>
            <div class="glass-panel">
                <div class="stat-label">Total Guardado</div>
                <div id="total-saved" class="stat-value" style="color: #3b82f6;">$0</div>
            </div>
            <div class="glass-panel">
                <div class="stat-label">Pendiente Total</div>
                <div id="total-p" class="stat-value" style="color: var(--accent);">$0</div>
            </div>
            <div class="glass-panel">
                <div class="stat-label">Black Intl en CLP</div>
                <div id="total-intl-clp" class="stat-value" style="color: #f0d060;">$0</div>
            </div>
        </div>

        <!-- Tipo de cambio editable -->
        <div class="tc-bar">
            <label>Tipo de cambio</label>
            <input type="number" id="tc-input" value="950" min="1" oninput="onTCChange()">
            <span>CLP por 1 USD</span>
        </div>

        <!-- Carrusel -->
        <div class="carousel-section">
            <div class="carousel-wrapper" id="carousel-wrapper">
                <div class="carousel-track" id="carousel-track">

                    <!-- ── TARJETA 1: Black CLP ── -->
                    <div class="card-unit">
                        <div class="visual-card card-chile">
                            <div style="display:flex; justify-content:space-between; align-items:center; z-index:2;">
                                <div class="chile-logo">Banco de Chile</div>
                                <span style="color:#aaa; font-size:0.6rem; letter-spacing:3px; font-family:'Space Grotesk'">BLACK</span>
                            </div>
                            <div class="chip"></div>
                            <div class="cupo-visual-container">
                                <div style="display:flex; justify-content:space-between; font-size:0.55rem; color:rgba(255,255,255,0.6); margin-bottom:4px; font-weight:800;">
                                    <span>USO DEL CUPO</span><span id="pct-cupo-black">0%</span>
                                </div>
                                <div class="cupo-bar-bg"><div id="fill-cupo-black" class="cupo-bar-fill"></div></div>
                            </div>
                            <div class="card-inner-inputs">
                                <div class="inner-group"><label>Gastado</label><input type="text" id="u-black" oninput="run('black','u')"></div>
                                <div class="inner-group"><label>Disponible</label><input type="text" id="a-black" oninput="run('black','a')"></div>
                            </div>
                        </div>
                        <div class="info-panel">
                            <div class="info-row">
                                <label>Fondo Reservado</label>
                                <input type="text" id="r-black" oninput="run('black','r')">
                            </div>
                            <div class="progress-bar-payment"><div id="bar-black" class="progress-fill-payment"></div></div>
                            <div class="bottom-stats">
                                <div class="mini-stat"><span>Falta por recaudar</span><b id="p-black" class="needed">$0</b></div>
                                <div id="status-black" style="font-size:0.7rem;font-weight:800;letter-spacing:1px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- ── TARJETA 2: Tenpo ── -->
                    <div class="card-unit">
                        <div class="visual-card card-tenpo">
                            <div class="tenpo-logo" style="z-index:2;">Tenpo</div>
                            <div class="chip"></div>
                            <div class="cupo-visual-container">
                                <div style="display:flex; justify-content:space-between; font-size:0.55rem; color:rgba(255,255,255,0.8); margin-bottom:4px; font-weight:800;">
                                    <span>USO DEL CUPO</span><span id="pct-cupo-tenpo">0%</span>
                                </div>
                                <div class="cupo-bar-bg" style="background:rgba(0,0,0,0.2);">
                                    <div id="fill-cupo-tenpo" class="cupo-bar-fill" style="background:linear-gradient(90deg,#fff,#35e38e);"></div>
                                </div>
                            </div>
                            <div class="card-inner-inputs">
                                <div class="inner-group"><label>Gastado</label><input type="text" id="u-tenpo" oninput="run('tenpo','u')"></div>
                                <div class="inner-group"><label>Disponible</label><input type="text" id="a-tenpo" oninput="run('tenpo','a')"></div>
                            </div>
                        </div>
                        <div class="info-panel">
                            <div class="info-row">
                                <label>Fondo Reservado</label>
                                <input type="text" id="r-tenpo" oninput="run('tenpo','r')">
                            </div>
                            <div class="progress-bar-payment"><div id="bar-tenpo" class="progress-fill-payment"></div></div>
                            <div class="bottom-stats">
                                <div class="mini-stat"><span>Falta por recaudar</span><b id="p-tenpo" class="needed">$0</b></div>
                                <div id="status-tenpo" style="font-size:0.7rem;font-weight:800;letter-spacing:1px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- ── TARJETA 3: Black Internacional USD ── -->
                    <div class="card-unit">
                        <div class="visual-card card-intl">
                            <div style="display:flex; justify-content:space-between; align-items:center; z-index:2;">
                                <div class="intl-logo">Banco de Chile</div>
                                <span class="intl-badge">BLACK INTL</span>
                            </div>
                            <div class="usd-tag">USD</div>
                            <div class="chip"></div>
                            <div class="cupo-visual-container">
                                <div style="display:flex; justify-content:space-between; font-size:0.55rem; color:rgba(200,170,60,0.8); margin-bottom:4px; font-weight:800;">
                                    <span>USO DEL CUPO — USD $1.000</span><span id="pct-cupo-intl">0%</span>
                                </div>
                                <div class="cupo-bar-bg" style="border-color:rgba(180,140,40,0.2);">
                                    <div id="fill-cupo-intl" class="cupo-bar-fill" style="background:linear-gradient(90deg,#f0d060,#f87171);"></div>
                                </div>
                            </div>
                            <div class="card-inner-inputs">
                                <div class="inner-group">
                                    <label>Gastado (USD)</label>
                                    <!-- type=number para evitar el bug de formateo -->
                                    <input type="number" id="u-intl" class="intl-input"
                                           step="0.01" min="0" max="1000"
                                           placeholder="0"
                                           oninput="runUSD('intl','u')">
                                </div>
                                <div class="inner-group">
                                    <label>Disponible (USD)</label>
                                    <input type="number" id="a-intl" class="intl-input"
                                           step="0.01" min="0" max="1000"
                                           placeholder="1000"
                                           oninput="runUSD('intl','a')">
                                </div>
                            </div>
                        </div>
                        <div class="info-panel" style="border-color:rgba(180,140,40,0.15);">
                            <div class="info-row">
                                <label>Fondo Reservado (USD)</label>
                                <input type="number" id="r-intl" class="intl-input"
                                       style="color:#f0d060 !important; width:120px;"
                                       step="0.01" min="0" max="1000"
                                       placeholder="0"
                                       oninput="runUSD('intl','r')">
                            </div>
                            <div class="progress-bar-payment">
                                <div id="bar-intl" class="progress-fill-payment" style="background:#f0d060;"></div>
                            </div>

                                <div class="mini-stat">
                                    <span>Falta por recaudar (USD)</span>
                                    <b id="p-intl" class="needed">USD 0</b>

                            <!-- Conversión a CLP -->
                            <div class="conv-row">

            <div class="carousel-dots" id="carousel-dots"></div>
            <div class="carousel-arrows">
                <button class="arrow-btn" id="btn-prev" onclick="slideTo(currentIndex - 1)">←</button>
                <button class="arrow-btn" id="btn-next" onclick="slideTo(currentIndex + 1)">→</button>
            </div>
        </div>
    </div>

    <script>
        /* ── CLP ── */
        const CUPO = { black: 500000, tenpo: 800000 };
        function parse(v)  { return Number((v || '').replace(/\D/g, '')) || 0; }
        function clp(v)    { return '$' + Math.max(0, v).toLocaleString('es-CL'); }

        function run(c, f) {
            const uI = document.getElementById(`u-${c}`);
            const aI = document.getElementById(`a-${c}`);
            const rI = document.getElementById(`r-${c}`);
            const pI = document.getElementById(`p-${c}`);
            const bar = document.getElementById(`bar-${c}`);
            const bC  = document.getElementById(`fill-cupo-${c}`);
            const pC  = document.getElementById(`pct-cupo-${c}`);
            const st  = document.getElementById(`status-${c}`);

            let u = parse(uI.value), a = parse(aI.value), r = parse(rI.value);
            if (f === 'u') { a = CUPO[c] - u; aI.value = clp(a); }
            else if (f === 'a') { u = CUPO[c] - a; uI.value = clp(u); }

            uI.value = clp(u); aI.value = clp(a); rI.value = clp(r);

            const pCupo = Math.min(100, (u / CUPO[c]) * 100);
            bC.style.width = pCupo + '%'; pC.innerText = Math.round(pCupo) + '%';
            bar.style.width = (u > 0 ? Math.min(100, (r / u) * 100) : 0) + '%';

            const resta = u - r;
            if (u > 0 && resta <= 0) { pI.innerText = '$0'; pI.className = 'ready'; st.innerText = '✓ COMPLETADO'; st.style.color = 'var(--accent)'; }
            else { pI.innerText = clp(resta); pI.className = 'needed'; st.innerText = ''; }
            save(); totals();
        }

        /* ── USD ── */
        const CUPO_USD = 1000;

        function getTC() {
            return parseFloat(document.getElementById('tc-input').value) || 950;
        }

        function runUSD(c, f) {
            const uI = document.getElementById(`u-${c}`);
            const aI = document.getElementById(`a-${c}`);
            const rI = document.getElementById(`r-${c}`);
            const pI = document.getElementById(`p-${c}`);
            const bar = document.getElementById(`bar-${c}`);
            const bC  = document.getElementById(`fill-cupo-${c}`);
            const pC  = document.getElementById(`pct-cupo-${c}`);
            const st  = document.getElementById(`status-${c}`);

            // Leer directamente como número (type=number evita el bug de formateo)
            let u = parseFloat(uI.value) || 0;
            let a = parseFloat(aI.value) || 0;
            let r = parseFloat(rI.value) || 0;

            // Solo calcular el otro campo, NO reformatear el que el usuario está editando
            if (f === 'u') { aI.value = Math.max(0, CUPO_USD - u).toFixed(2); }
            else if (f === 'a') { uI.value = Math.max(0, CUPO_USD - a).toFixed(2); u = CUPO_USD - a; }

            const pCupo = Math.min(100, (u / CUPO_USD) * 100);
            bC.style.width = pCupo + '%'; pC.innerText = Math.round(pCupo) + '%';
            bar.style.width = (u > 0 ? Math.min(100, (r / u) * 100) : 0) + '%';

            const resta = u - r;
            if (u > 0 && resta <= 0) { pI.innerText = 'USD 0'; pI.className = 'ready'; st.innerText = '✓ COMPLETADO'; st.style.color = 'var(--accent)'; }
            else { pI.innerText = 'USD ' + Math.max(0, resta).toFixed(2); pI.className = 'needed'; st.innerText = ''; }

            // Conversión a CLP
            const tc = getTC();
            const uEnClp = Math.round(u * tc);
            document.getElementById('intl-en-clp').innerText = clp(uEnClp);
            document.getElementById('total-intl-clp').innerText = clp(uEnClp);

            save(); totals();
        }

        function onTCChange() {
            // Recalcular conversión al cambiar el TC sin necesidad de tocar los inputs
            const u = parseFloat(document.getElementById('u-intl').value) || 0;
            const tc = getTC();
            const uEnClp = Math.round(u * tc);
            document.getElementById('intl-en-clp').innerText = clp(uEnClp);
            document.getElementById('total-intl-clp').innerText = clp(uEnClp);
            localStorage.setItem('tc_usd', String(tc));
            totals();
        }

        /* ── TOTALES ── */
        function totals() {
            let td = 0, tp = 0, ts = 0;
            ['black', 'tenpo'].forEach(c => {
                const u = parse(document.getElementById(`u-${c}`).value);
                const r = parse(document.getElementById(`r-${c}`).value);
                td += u; ts += r;
                if ((u - r) > 0) tp += (u - r);
            });
            // Sumar intl convertida a CLP al total de deuda
            const uIntl = parseFloat(document.getElementById('u-intl').value) || 0;
            const intlClp = Math.round(uIntl * getTC());
            td += intlClp;

            document.getElementById('total-d').innerText     = clp(td);
            document.getElementById('total-p').innerText     = clp(tp);
            document.getElementById('total-saved').innerText = clp(ts);
        }

        /* ── GUARDAR / CARGAR ── */
        function save() {
            const d = {
                black: { u: parse(document.getElementById('u-black').value), r: parse(document.getElementById('r-black').value) },
                tenpo: { u: parse(document.getElementById('u-tenpo').value), r: parse(document.getElementById('r-tenpo').value) },
                intl:  { u: parseFloat(document.getElementById('u-intl').value) || 0, r: parseFloat(document.getElementById('r-intl').value) || 0 }
            };
            localStorage.setItem('wallet_v4', JSON.stringify(d));
        }

        function toggleT() {
            document.getElementById('b').classList.toggle('light');
            localStorage.setItem('theme', document.getElementById('b').classList.contains('light') ? 'light' : 'dark');
        }

        /* ── CARRUSEL ── */
        const track   = document.getElementById('carousel-track');
        const dotsEl  = document.getElementById('carousel-dots');
        const cards   = document.querySelectorAll('.card-unit');
        const N       = cards.length;
        let currentIndex = 0;

        cards.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            d.onclick = () => slideTo(i);
            dotsEl.appendChild(d);
        });

        function getCardWidth() { return cards[0].offsetWidth + 24; }

        function slideTo(idx) {
            idx = Math.max(0, Math.min(N - 1, idx));
            currentIndex = idx;
            track.style.transform = `translateX(-${idx * getCardWidth()}px)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
            document.getElementById('btn-prev').disabled = idx === 0;
            document.getElementById('btn-next').disabled = idx === N - 1;
        }

        document.getElementById('btn-prev').disabled = true;
        window.addEventListener('resize', () => slideTo(currentIndex));

        let startX = 0, isDragging = false, startTranslate = 0;
        function getTranslate() { return new WebKitCSSMatrix(window.getComputedStyle(track).transform).m41; }

        const isInput = e => e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT';

        track.addEventListener('mousedown',  e => { if (isInput(e)) return; isDragging = true; startX = e.clientX; startTranslate = getTranslate(); track.classList.add('grabbing'); });
        track.addEventListener('mousemove',  e => { if (!isDragging) return; track.style.transform = `translateX(${startTranslate + e.clientX - startX}px)`; });
        track.addEventListener('mouseup',    e => { if (!isDragging) return; isDragging = false; track.classList.remove('grabbing'); const dx = e.clientX - startX; const t = getCardWidth()*0.25; if (dx < -t) slideTo(currentIndex+1); else if (dx > t) slideTo(currentIndex-1); else slideTo(currentIndex); });
        track.addEventListener('mouseleave', e => { if (!isDragging) return; isDragging = false; track.classList.remove('grabbing'); slideTo(currentIndex); });
        track.addEventListener('touchstart', e => { if (isInput(e)) return; startX = e.touches[0].clientX; startTranslate = getTranslate(); track.classList.add('grabbing'); }, { passive: true });
        track.addEventListener('touchmove',  e => { if (!isDragging && startX === 0) return; track.style.transform = `translateX(${startTranslate + e.touches[0].clientX - startX}px)`; }, { passive: true });
        track.addEventListener('touchend',   e => { track.classList.remove('grabbing'); const dx = e.changedTouches[0].clientX - startX; const t = getCardWidth()*0.25; if (dx < -t) slideTo(currentIndex+1); else if (dx > t) slideTo(currentIndex-1); else slideTo(currentIndex); });

        /* ── INICIALIZAR ── */
        window.onload = () => {
            if (localStorage.getItem('theme') === 'light') document.getElementById('b').classList.add('light');

            // Restaurar tipo de cambio guardado
            const tcGuardado = localStorage.getItem('tc_usd');
            if (tcGuardado) document.getElementById('tc-input').value = tcGuardado;

            const s = JSON.parse(localStorage.getItem('wallet_v4'));
            if (s) {
                if (s.black) { document.getElementById('u-black').value = clp(s.black.u); document.getElementById('r-black').value = clp(s.black.r); run('black','u'); }
                if (s.tenpo) { document.getElementById('u-tenpo').value = clp(s.tenpo.u); document.getElementById('r-tenpo').value = clp(s.tenpo.r); run('tenpo','u'); }
                if (s.intl)  { document.getElementById('u-intl').value = s.intl.u; document.getElementById('r-intl').value = s.intl.r; runUSD('intl','u'); }
            } else {
                document.getElementById('a-black').value = clp(CUPO.black);
                document.getElementById('a-tenpo').value = clp(CUPO.tenpo);
                document.getElementById('a-intl').value  = CUPO_USD;
            }
            slideTo(0);
        };
    </script>
</body>
</html>
