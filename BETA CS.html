<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compensación Seguros — Inspector de Siniestros</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="App de inspección de siniestros hogar — Compensación Seguros">
<link rel="manifest" href="manifest.json" onerror="this.remove()">
<link rel="icon" href="icons/icon-192.png" onerror="this.remove()">
<link rel="apple-touch-icon" href="icons/icon-180.png" onerror="this.remove()">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="C.Seguros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- jsPDF cargado localmente: la app funciona 100% sin conexión. Si el archivo local
     no está disponible, más abajo hay un respaldo que lo carga desde internet. -->
<script src="jspdf.umd.min.js" onerror="console.warn('jspdf.umd.min.js local no encontrado, se usará respaldo por CDN al generar el PDF')"></script>
<style>
:root{
  --navy:#17140A;
  --navy-2:#211C0F;
  --navy-3:#0A0A0A;
  --paper:#F5F4EF;
  --card:#FFFFFF;
  --amber:#B7AF3D;
  --amber-bright:#D8CE55;
  --amber-ink:#3A3608;
  --red:#C1443C;
  --green:#4C8C6B;
  --ink:#1B2027;
  --muted:#69737F;
  --line:#DFE2DE;
  --line-2:#CBD0CB;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-weight:700;
  letter-spacing:-0.01em;
}
.mono{font-family:'Courier New',ui-monospace,monospace;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--amber);color:var(--navy-3);}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--navy-3);
  border-bottom:4px solid var(--amber);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:sticky;
  top:0;
  z-index:50;
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:8px;
  flex-shrink:0;
  overflow:hidden;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
.brand-mark img{width:100%;height:100%;object-fit:cover;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text .name{font-family:'Space Grotesk';font-weight:700;font-size:18px;}
.brand-text .tag{font-family:'IBM Plex Mono';font-size:10.5px;color:#C7CEDB;letter-spacing:.04em;text-transform:uppercase;}
.brand-text .tag-brand{font-family:'Space Grotesk',system-ui,sans-serif;font-size:12px;font-weight:500;color:var(--amber-bright);letter-spacing:.01em;}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

button.btn{
  border:none;border-radius:7px;padding:9px 14px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .08s ease, box-shadow .12s ease, filter .12s ease;
}
button.btn:active{transform:translateY(1px);}
.btn-amber{background:var(--amber);color:var(--amber-ink);}
.btn-amber:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)!important;}
.btn-outline:hover{background:rgba(255,255,255,.08);}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line-2)!important;}
.btn-ghost:hover{background:#F0F1EE;}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid rgba(193,68,60,.4)!important;}
.btn-danger:hover{background:rgba(193,68,60,.08);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{filter:brightness(1.15);}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}

main{flex:1;width:100%;}

/* ---------- List view ---------- */
.list-wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
.list-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.list-header h1{font-size:26px;margin:0 0 4px;}
.list-header p{margin:0;color:var(--muted);font-size:14px;max-width:520px;}
.empty-state{
  border:2px dashed var(--line-2);border-radius:var(--radius);padding:50px 24px;text-align:center;color:var(--muted);
  background:repeating-linear-gradient(-45deg, #fff 0 14px, #F7F7F4 14px 28px);
}
.empty-state .big{font-family:'Space Grotesk';font-size:19px;color:var(--ink);font-weight:600;margin-bottom:6px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,30,45,.04);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tag-color,var(--navy));}
.tagline{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.badge{
  font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;background:var(--navy);color:#fff;
}
.badge.sismo{background:#8B4A9C;}
.badge.viento{background:#3B7FA6;}
.badge.lluvia{background:#2F6FA8;}
.badge.canerias{background:#4C8C6B;}
.badge.incendio{background:#C1443C;}
.badge.otro{background:#6B6357;}
.card h3{margin:0 0 3px;font-size:16.5px;}
.card .addr{color:var(--muted);font-size:13px;margin-bottom:10px;}
.card .stats{display:flex;gap:14px;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);margin-bottom:12px;}
.card .stats b{color:var(--ink);font-weight:600;}
.card .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- Editor ---------- */
.editor-wrap{max-width:920px;margin:0 auto;padding:24px 20px 90px;}
.section{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 20px 22px;margin-bottom:18px;
}
.section-title{
  display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:15px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--navy);font-family:'IBM Plex Mono';font-weight:600;
}
.section-title .num{
  width:22px;height:22px;border-radius:5px;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;flex-shrink:0;
}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  border:1.5px solid var(--line-2);border-radius:7px;padding:9px 10px;font-size:14px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
.field.full{grid-column:1/-1;}

.recinto-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.recinto-add input{flex:1;min-width:180px;border:1.5px solid var(--line-2);border-radius:7px;padding:9px 10px;font-size:14px;}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.preset-chip{
  border:1px dashed var(--line-2);background:#fff;color:var(--navy);border-radius:20px;padding:5px 11px;font-size:12.5px;
}
.preset-chip:hover{border-color:var(--amber);background:#FFF7E8;}

.recinto{border:1.5px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden;}
.recinto-head{
  background:var(--navy);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.recinto-head input.recinto-name{
  flex:1 1 90px;min-width:0;background:transparent;border:none;color:#fff;font-family:'Space Grotesk';font-weight:600;font-size:15.5px;
  border-bottom:1px dashed rgba(255,255,255,.3);padding:2px 2px;
}
.recinto-head input.recinto-name:focus{outline:none;border-bottom-color:var(--amber);}
.recinto-count{font-family:'IBM Plex Mono';font-size:11px;color:#C7CEDB;white-space:nowrap;flex-shrink:0;}
.recinto-head .btn-del-recinto{flex-shrink:0;white-space:nowrap;}
.recinto-body{padding:14px;background:#FBFBFA;}
.recinto-body.collapsed{display:none;}
.medidas-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line-2);}
.medidas-row .field{flex:0 0 100px;min-width:90px;}
.medidas-row .field.area{flex:0 0 130px;min-width:110px;}
.medidas-row .area-value{
  border:1.5px solid var(--line-2);border-radius:7px;padding:9px 10px;font-size:14px;background:#F0F1EE;color:var(--muted);
  font-family:'IBM Plex Mono';
}

.dano{border:1px solid var(--line);border-radius:8px;background:#fff;padding:13px;margin-bottom:10px;}
.dano-top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.dano-top .field{flex:1;min-width:160px;}
.dano-top .field.qty{flex:0 0 100px;min-width:90px;}
.dano-top .field.unit{flex:0 0 110px;min-width:100px;}
.dano textarea{width:100%;}
.dano-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px;}
.photo-item{position:relative;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#F0F1EE;}
.photo-item img{width:100%;height:88px;object-fit:cover;display:block;}
.photo-item .ph-loading{height:88px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';}
.photo-item input.caption{
  width:100%;border:none;border-top:1px solid var(--line);font-size:10.5px;padding:4px 5px;background:#fff;color:var(--ink);
}
.photo-item .rm{
  position:absolute;top:4px;right:4px;background:rgba(20,20,20,.65);color:#fff;border:none;border-radius:5px;
  width:20px;height:20px;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.photo-add-btn{
  position:relative;
  height:88px;border:1.5px dashed var(--line-2);border-radius:7px;background:#fff;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:4px;
  cursor:pointer;user-select:none;
}
.photo-add-btn:hover{border-color:var(--amber);color:var(--amber-ink);background:#FFF7E8;}
.photo-add-btn input[type=file]{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.cam-overlay{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column;}
.cam-overlay video{flex:1;width:100%;height:100%;object-fit:cover;background:#000;}
.cam-top{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:16px 16px calc(16px + env(safe-area-inset-top,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  background:linear-gradient(rgba(0,0,0,.55),transparent);
}
.cam-icon-btn{
  background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:50%;
  width:42px;height:42px;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.cam-counter{color:#fff;font-family:'IBM Plex Mono';font-size:12.5px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:20px;}
.cam-bottom{
  position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;
  padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.6));
}
.cam-shutter{
  width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.45);
  flex-shrink:0;
}
.cam-shutter:active{background:var(--amber);}
.cam-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#fff;font-family:'IBM Plex Mono';font-size:13px;padding:30px;
}

.empty-hint{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px;}

.action-bar{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 -2px 8px rgba(0,0,0,.04);
}
.save-indicator{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.pending{background:var(--amber);}

.hazard-divider{height:6px;background:repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--navy) 10px 20px);border-radius:3px;margin:0 0 18px;}

@media (max-width:640px){
  .topbar{flex-direction:column;align-items:stretch;}
  .topbar-actions{justify-content:flex-start;}
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(10,10,10,.6);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:#fff;border-radius:12px;max-width:520px;width:100%;
  padding:24px 24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  border-top:5px solid var(--amber);
  max-height:85vh;overflow-y:auto;
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--navy-3);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;
  border-left:4px solid var(--amber);z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:10px;
}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   INSPECTORHOGAR — App de inspección de siniestros hogar
   ============================================================ */

const TIPOS_SINIESTRO = [
  {v:'sismo', l:'Sismo', c:'sismo'},
  {v:'viento', l:'Viento, lluvia o inundaciones', c:'viento'},
  {v:'canerias', l:'Rotura de cañerías', c:'canerias'},
  {v:'incendio', l:'Incendio', c:'incendio'},
  {v:'otro', l:'Otro', c:'otro'},
];
const TIPOS_PROPIEDAD = [
  {v:'casa', l:'Casa'},
  {v:'depto', l:'Departamento'},
  {v:'comercial', l:'Comercial'},
  {v:'comun', l:'Áreas comunes'},
];
const TIPOS_DANO = [
  'Grietas / fisuras estructurales en muros',
  'Grietas / fisuras no estructurales en muros',
  'Grietas / fisuras estructurales en cielo',
  'Grietas / fisuras no estructurales en cielo',
  'Sello cornisas',
  'Sello y fijación marco puerta',
  'Sello y fijación marco ventana',
  'Sello en guardapolvos',
  'Cerámicas fisuradas',
  'Cerámicas desprendidas',
  'Fragüe fisurado',
  'Humedad / filtración de agua',
  'Filtración por techumbre',
  'Rotura de cañerías',
  'Rotura de vidrios',
  'Daño en cielo entretecho',
  'Daños en revestimientos',
  'Daños en pisos / pavimentos',
  'Daños en instalación eléctrica',
  'Daño por hollín / incendio',
  'Daño en mobiliario fijo',
  'Colapso parcial',
  'Daño en contenido',
  'Otro',
];
const UNIDADES = ['m²','ml','m³','un','%','global'];

const PRESETS = {
  casa: ['Living-comedor','Cocina','Dormitorio 1','Dormitorio 2','Dormitorio 3','Baño','Terraza','Techumbre','Estacionamiento','Bodega','Fachada frontal','Fachada lateral izquierda','Fachada lateral derecha','Fachada posterior','Logia','Cierre perimetral','Pasillo de distribución','Sala de estar','Walk-in closet','Hall de acceso'],
  depto: ['Living-comedor','Cocina','Dormitorio 1','Dormitorio 2','Dormitorio 3','Baño','Balcón/Terraza','Bodega','Logia','Pasillo de distribución','Sala de estar','Walk-in closet','Hall de acceso'],
  comercial: ['Local / oficina','Recepción','Baño','Bodega','Fachada frontal','Fachada lateral izquierda','Fachada lateral derecha','Fachada posterior','Cierre perimetral','Estacionamiento','Sala de estar','Hall de acceso','Sala de ventas','Galpón','Cocina','Sala de máquinas'],
  comun: ['Fachada frontal edificio','Fachada lateral izquierda edificio','Fachada lateral derecha edificio','Fachada posterior edificio','Techumbre','Hall de acceso','Escaleras','Pasillos comunes','Estacionamientos','Sala de máquinas','Piscina','Quincho','Sala multiuso','Ascensor','Bodegas comunes','Áreas verdes','Sala de recepción','Sala lavandería','Gimnasio'],
};

/* ---------- estado ---------- */
let view = 'list';           // 'list' | 'editor'
let index = [];              // [{id, cliente, direccion, comuna, tipoSiniestro, tipoPropiedad, fecha, nRecintos, nDanos, nFotos}]
let current = null;          // inspección abierta
let fotoCache = {};          // {fotoId: dataUrl}
let dirty = false;

/* ---------- storage helpers (IndexedDB — funciona offline en Safari/Chrome, iOS y Android) ---------- */
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
    const req = indexedDB.open('InspectorHogarDB', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', {keyPath:'key'});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function storageGet(key){
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('kv','readonly');
      const r = tx.objectStore('kv').get(key);
      r.onsuccess = ()=> resolve(r.result ? r.result.value : null);
      r.onerror = ()=> reject(r.error);
    });
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put({key, value});
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ return false; }
}
async function storageDelete(key){
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ return false; }
}

async function loadIndex(){
  const raw = await storageGet('index', false);
  index = raw ? JSON.parse(raw) : [];
}
async function saveIndex(){
  await storageSet('index', JSON.stringify(index), false);

function summarize(insp){
  let nDanos=0, nFotos=0;
  insp.recintos.forEach(r=>r.danos.forEach(d=>{ nDanos++; nFotos += d.fotos.length; }));
  return {
    id: insp.id, cliente: insp.meta.cliente||'', direccion: insp.meta.direccion||'',
    comuna: insp.meta.comuna||'', tipoSiniestro: insp.meta.tipoSiniestro, tipoPropiedad: insp.meta.tipoPropiedad,
    fecha: insp.meta.fecha||'', nRecintos: insp.recintos.length, nDanos, nFotos, updatedAt: Date.now(),
    finalizado: !!insp.meta.finalizado,
  };
}
async function persistCurrent(){
  if(!current) return;
  await storageSet('insp_'+current.id, JSON.stringify(current), false);
  const sum = summarize(current);
  const i = index.findIndex(e=>e.id===current.id);
  if(i>=0) index[i]=sum; else index.unshift(sum);
  await saveIndex();
  dirty = false;
  updateSaveIndicator();
}
function scheduleSave(){
  dirty = true;
  updateSaveIndicator();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistCurrent, 650);
}
function updateSaveIndicator(){
  const el = document.getElementById('saveInd');
  if(!el) return;
  el.innerHTML = dirty
    ? '<span class="dot pending"></span> Guardando…'
    : '<span class="dot"></span> Guardado';
}

async function sendPDFByEmail(doc, filename, meta, emails){
  const s = await loadSettings();
  if(s.scriptUrl){
    return sendPDFViaAppsScript(doc, filename, meta, emails, s.scriptUrl);
  }
  return sendPDFViaEmailJS(doc, filename, meta, emails, s);

async function sendPDFViaAppsScript(doc, filename, meta, emails, scriptUrl){
  const pdfBase64 = doc.output('datauristring').split(',')[1]; // solo el base64, sin el prefijo data:...
  const payload = {
    to: emails.join(','),
    subject: 'Informe de inspección — ' + (meta.cliente || meta.direccion || 'Compensación Seguros'),
    body: 'Se adjunta el informe de inspección de siniestro generado en Compensación Seguros.\n\n'
        + 'Cliente: ' + (meta.cliente || '—') + '\n'
        + 'Dirección: ' + (meta.direccion || '—') + '\n'
        + 'Tipo de siniestro: ' + labelTipoSiniestro(meta.tipoSiniestro) + '\n'
        + 'Fecha: ' + (meta.fecha || '—'),
    filename: filename,
    pdfBase64: pdfBase64,
  };
  try{
    // "no-cors": los Web Apps de Apps Script no devuelven cabeceras CORS, así
    // que no se puede leer la respuesta desde el navegador; esto solo evita
    // que fetch tire un error, pero no confirma el envío real.
    await fetch(scriptUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita el preflight de CORS
      body: JSON.stringify(payload),
    });
    return { sent:true, method:'apps-script', unconfirmed:true };
  }catch(err){
    return { sent:false, method:'apps-script', reason:'error', message:String(err && err.message || err) };
  }
}

  const payload = {

    user_id: EMAILJS_PUBLIC_KEY,
    template_params: {
      to_email: emails.join(','),
      cliente: meta.cliente || '—',
      direccion: meta.direccion || '—',
      tipo_siniestro: labelTipoSiniestro(meta.tipoSiniestro),
      fecha: meta.fecha || '—',
      mensaje: 'Se adjunta el informe de inspección de siniestro generado en Compensación Seguros.',
      pdf_attachment: pdfDataUri,
    },
  };
  if(s.privateKey) payload.accessToken = s.privateKey;
  const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  const text = await resp.text().catch(()=>'');
  if(resp.ok) return { sent:true };
  return { sent:false, reason:'failed', status:resp.status, message:text };
}

/* ---------- finalizar inspección ---------- */
async function finalizeInspection(){
  if(!current) return;

  showLoading(true, 'Generando informe PDF…');

/* ---------- fotos ---------- */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1500; quality = quality||0.72;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({dataUrl, width:w, height:h});
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
async function fetchFoto(fotoId){
  if(fotoCache[fotoId]) return fotoCache[fotoId];
  const v = await storageGet('foto_'+fotoId, false);
  if(v) fotoCache[fotoId]=v;
  return v;
}

/* ---------- cámara propia (fuerza la cámara trasera) ---------- */
/*
  El atributo capture="environment" del <input type=file> es solo una
  "sugerencia" para el navegador/SO — varios navegadores y dispositivos lo
  ignoran y abren la cámara frontal igual. getUserMedia con
  facingMode:{ideal:'environment'} es mucho más confiable porque le pide
  explícitamente al sistema la cámara trasera. Por eso la app abre su propia
  pantalla de cámara en vez de usar el selector nativo de archivos.

  Requiere HTTPS (o localhost) para funcionar — es una restricción de
  seguridad de los navegadores para cualquier sitio que use getUserMedia, no
  de esta app. Si por algún motivo falla (navegador viejo, sin HTTPS, o el
  usuario niega el permiso), cae de respaldo al selector nativo de la cámara
  del teléfono (el mismo comportamiento que había antes).
*/
let camState = null; // {stream, rid, did, count, facing}

async function openCamera(rid, did){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    triggerCameraFallback(rid, did);
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false,
    });
    camState = { stream, rid, did, count:0, facing:'environment' };
    showCameraOverlay();
  }catch(err){
    triggerCameraFallback(rid, did);
  }
}
function triggerCameraFallback(rid, did){
  const input = document.querySelector(`input[data-camera-fallback][data-rid="${rid}"][data-did="${did}"]`);
  if(input) input.click();
  else toast('No se pudo acceder a la cámara en este dispositivo.');
}
function showCameraOverlay(){
  let overlay = document.getElementById('cameraOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'cam-overlay';
    overlay.id = 'cameraOverlay';
    overlay.innerHTML = `
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-top">
        <button class="cam-icon-btn" type="button" data-cam-action="close" aria-label="Cerrar cámara">✕</button>
        <span class="cam-counter" id="camCounter">0 foto(s)</span>
        <button class="cam-icon-btn" type="button" data-cam-action="flip" aria-label="Cambiar cámara">⟳</button>
      </div>
      <div class="cam-bottom">
        <button class="cam-shutter" type="button" data-cam-action="shoot" aria-label="Tomar foto"></button>
        <button class="btn btn-amber" type="button" data-cam-action="done">Listo</button>
      </div>
    `;
    // se agrega a <body> y no a #app: render() reemplaza app.innerHTML
    // completo cada vez que se guarda una foto, y eso borraría este overlay
    // si estuviera dentro de #app.
    document.body.appendChild(overlay);
  }
  document.getElementById('camVideo').srcObject = camState.stream;
  document.getElementById('camCounter').textContent = camState.count+' foto(s)';
}
async function flipCameraFacing(){
  if(!camState) return;
  const nueva = camState.facing==='environment' ? 'user' : 'environment';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal: nueva } }, audio:false });
    camState.stream.getTracks().forEach(t=>t.stop());
    camState.stream = stream;
    camState.facing = nueva;
    document.getElementById('camVideo').srcObject = stream;
  }catch(err){ toast('No se pudo cambiar de cámara'); }
}
function shootCameraPhoto(){
  if(!camState) return;
  const video = document.getElementById('camVideo');
  if(!video.videoWidth){ return; } // aún no carga el primer frame
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob=>{
    if(!blob) return;
    camState.count++;
    const counter = document.getElementById('camCounter');
    if(counter) counter.textContent = camState.count+' foto(s)';
    handleFiles(camState.rid, camState.did, [blob]);
  }, 'image/jpeg', 0.92);
}
function closeCameraOverlay(){
  if(camState){ camState.stream.getTracks().forEach(t=>t.stop()); camState = null; }
  const overlay = document.getElementById('cameraOverlay');
  if(overlay) overlay.remove();
}

async function handleFiles(rid, did, files){
  const r = findRecinto(rid); const d = r && r.danos.find(x=>x.id===did);
  if(!d) return;
  showLoading(true, 'Procesando '+files.length+' imagen(es)…');
  for(const file of files){
    try{
      const {dataUrl, width, height} = await compressImage(file);
      const fid = uid();
      await storageSet('foto_'+fid, dataUrl, false);
      fotoCache[fid] = dataUrl;
      d.fotos.push({id:fid, caption:'', width, height});
    }catch(e){ /* saltar archivo con error */ }
  }
  showLoading(false);
  scheduleSave(); render();
}

function fitBox(iw, ih, bw, bh){
  const scale = Math.min(bw/iw, bh/ih);
  return {w: iw*scale, h: ih*scale};
}
function labelTipoSiniestro(v){ const t=TIPOS_SINIESTRO.find(x=>x.v===v); return t? t.l : v; }

/* ---------- medidas de recintos ---------- */
function computeAreaPiso(r){
  const l = parseFloat(r.largo), a = parseFloat(r.ancho);
  if(!isNaN(l) && !isNaN(a) && l>0 && a>0) return l*a;
  return null;
}
function computeAreaMuros(r){
  const l = parseFloat(r.largo), a = parseFloat(r.ancho), h = parseFloat(r.alto);
  if(!isNaN(l) && !isNaN(a) && l>0 && a>0 && !isNaN(h) && h>0) return 2*(l+a)*h;
  return null;
}
function computeAreaMuroSimple(r){
  const a = parseFloat(r.ancho), h = parseFloat(r.alto);
  if(!isNaN(a) && a>0 && !isNaN(h) && h>0) return a*h;
  return null;
}
function formatMedidas(r){
  const partes = [];
  if(r.largo) partes.push('Largo: '+r.largo+' m');
  if(r.ancho) partes.push('Ancho: '+r.ancho+' m');
  if(r.alto) partes.push('Alto: '+r.alto+' m');
  const piso = computeAreaPiso(r);
  if(piso!==null) partes.push('Área piso: '+piso.toFixed(2)+' m²');
  const muros = computeAreaMuros(r);
  if(muros!==null) partes.push('Área muros: '+muros.toFixed(2)+' m²');
  const muroSimple = computeAreaMuroSimple(r);
  if(muroSimple!==null) partes.push('Área muro (ancho×alto): '+muroSimple.toFixed(2)+' m²');
  return partes.join('   ·   ');
}
function updateAreaDisplay(rid){
  const r = findRecinto(rid); if(!r) return;
  const elPiso = document.getElementById('area-piso-'+rid);
  const elMuros = document.getElementById('area-muros-'+rid);
  const elMuroSimple = document.getElementById('area-muro-simple-'+rid);
  const piso = computeAreaPiso(r);
  const muros = computeAreaMuros(r);
  const muroSimple = computeAreaMuroSimple(r);
  if(elPiso) elPiso.textContent = piso!==null ? (piso.toFixed(2)+' m²') : '—';
  if(elMuros) elMuros.textContent = muros!==null ? (muros.toFixed(2)+' m²') : '—';
  if(elMuroSimple) elMuroSimple.textContent = muroSimple!==null ? (muroSimple.toFixed(2)+' m²') : '—';
}

/* Si jspdf.umd.min.js no está disponible localmente (por ejemplo, porque la app
   se abrió/instaló sin ese archivo junto a index.html), esto lo carga desde un
   CDN como respaldo. Requiere conexión a internet solo en ese caso puntual. */
let jsPDFLoadPromise = null;
function ensureJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if(jsPDFLoadPromise) return jsPDFLoadPromise;
  const CDN_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
  ];
  jsPDFLoadPromise = (async ()=>{
    for(const url of CDN_URLS){
      try{
        await new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = url;
          s.onload = ()=> (window.jspdf && window.jspdf.jsPDF) ? resolve() : reject(new Error('jsPDF no se expuso correctamente'));
          s.onerror = ()=> reject(new Error('No se pudo cargar '+url));
          document.head.appendChild(s);
        });
        if(window.jspdf && window.jspdf.jsPDF) return;
      }catch(e){ /* intenta el siguiente CDN */ }
    }
    throw new Error('No se pudo cargar el motor de PDF (jsPDF) ni localmente ni por internet. Revisa tu conexión.');
  })();
  return jsPDFLoadPromise;
}

async function buildPDFDoc(){
  if(!window.jspdf || !window.jspdf.jsPDF) await ensureJsPDF();
  {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const PW=210, PH=297, M=16, CW=PW-2*M;
    const navy=[15,13,7], amber=[183,175,61], muted=[105,115,127], ink=[27,32,39], line=[218,220,214];

    // precargar todas las fotos necesarias
    const allFotoIds = [];
    current.recintos.forEach(r=>r.danos.forEach(d=>d.fotos.forEach(f=>allFotoIds.push(f.id))));
    await Promise.all(allFotoIds.map(fetchFoto));

    const m = current.meta;

    /* ---- Portada ---- */
    doc.setFillColor(navy[0],navy[1],navy[2]);
    doc.rect(0,0,PW,64,'F');
    doc.setFillColor(amber[0],amber[1],amber[2]);
    doc.rect(0,64,PW,4,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(22);
    doc.text('INFORME DE INSPECCIÓN', M, 28);
    doc.text('DE SINIESTRO', M, 38);
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.setTextColor(220,224,232);
    doc.text("Compensación Seguros — Informe técnico de daños por recinto", M, 48);

    let y = 82;
    doc.setFillColor(amber[0],amber[1],amber[2]);
    doc.roundedRect(M, y-7, 86, 10, 2, 2, 'F');
    doc.setTextColor(60,40,5); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(('SINIESTRO: '+labelTipoSiniestro(m.tipoSiniestro)).toUpperCase(), M+4, y);
    y += 16;

    const rows = [
      ['Cliente / Asegurado', m.cliente||'—'],
      ['Dirección', m.direccion||'—'],
      ['Comuna / Ciudad', m.comuna||'—'],
      ['Tipo de propiedad', labelTipoPropiedad(m.tipoPropiedad)],
      ['N° Siniestro', m.poliza||'—'],
      ['Nombre inspector', m.inspector||'—'],
      ['Fecha de inspección', m.fecha||'—'],
    ];
    doc.setFontSize(10);
    rows.forEach(([label, val])=>{
      doc.setFont('helvetica','bold'); doc.setTextColor(ink[0],ink[1],ink[2]);
      doc.text(label.toUpperCase()+':', M, y);
      doc.setFont('helvetica','normal');
      const lines = doc.splitTextToSize(String(val), CW-70);
      doc.text(lines, M+62, y);
      y += 6.4 * Math.max(1,lines.length) + 0.5;
    });

    if(m.observaciones){
      y += 4;
      doc.setDrawColor(line[0],line[1],line[2]); doc.line(M,y,PW-M,y); y+=7;
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text('OBSERVACIONES GENERALES', M, y); y+=6;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      const obsLines = doc.splitTextToSize(m.observaciones, CW);
      doc.text(obsLines, M, y); y += obsLines.length*5.2 + 4;
    }

    // resumen stats
    let nDanos=0, nFotos=0;
    current.recintos.forEach(r=>r.danos.forEach(d=>{nDanos++; nFotos+=d.fotos.length;}));
    const stats = [['Recintos inspeccionados', current.recintos.length], ['Daños registrados', nDanos], ['Fotografías', nFotos]];
    const boxW = (CW - 12)/3;
    let sx = M;
    const sy = PH - 46;
    stats.forEach(([label,val])=>{
      doc.setDrawColor(line[0],line[1],line[2]);
      doc.setLineWidth(0.4);
      doc.roundedRect(sx, sy, boxW, 28, 2, 2);
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(navy[0],navy[1],navy[2]);
      doc.text(String(val), sx+6, sy+15);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(muted[0],muted[1],muted[2]);
      doc.text(label.toUpperCase(), sx+6, sy+22, {maxWidth: boxW-10});
      sx += boxW + 6;
    });
    doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text('Generado el '+new Date().toLocaleDateString('es-CL')+' con Compensación Seguros', M, PH-10);

    /* ---- Recintos ---- */
    current.recintos.forEach((r)=>{
      doc.addPage();
      let y = M;
      doc.setFillColor(navy[0],navy[1],navy[2]);
      doc.rect(M-2, y-2, CW+4, 12, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
      doc.text('RECINTO: '+(r.nombre||'—').toUpperCase(), M+2, y+6);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(r.danos.length+' daño(s)', PW-M-2, y+6, {align:'right'});
      y += 20;

      const medidasTxt = formatMedidas(r);
      if(medidasTxt){
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
        doc.text(medidasTxt, M, y);
        y += 8;
      }

      function ensure(space){
        if(y + space > PH - M - 8){ doc.addPage(); y = M; }
      }

      if(r.danos.length===0){
        doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(muted[0],muted[1],muted[2]);
        doc.text('Sin daños registrados en este recinto.', M, y);
      }

      r.danos.forEach((d, di)=>{
        ensure(20);
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(ink[0],ink[1],ink[2]);
        doc.text('Daño '+(di+1)+' — '+d.tipo, M, y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
        const medida = (d.cantidad? d.cantidad : '—') + ' ' + (d.unidad||'');
        doc.text('Medida afectada: '+medida, M, y); y+=6;
        if(d.descripcion){
          doc.setTextColor(ink[0],ink[1],ink[2]); doc.setFontSize(10);
          const lines = doc.splitTextToSize(d.descripcion, CW);
          ensure(lines.length*5.2);
          doc.text(lines, M, y); y += lines.length*5.2 + 3;
        }

        // fotos en grilla de 2 columnas
        const boxW = (CW-6)/2, boxH=62;
        for(let i=0;i<d.fotos.length;i+=2){
          ensure(boxH+10);
          const pair = [d.fotos[i], d.fotos[i+1]];
          pair.forEach((f, idx)=>{
            if(!f) return;
            const bx = M + idx*(boxW+6);
            doc.setDrawColor(line[0],line[1],line[2]);
            doc.roundedRect(bx, y, boxW, boxH, 1.5, 1.5);
            const dataUrl = fotoCache[f.id];
            if(dataUrl){
              const fit = fitBox(f.width||4, f.height||3, boxW-6, boxH-14);
              const ox = bx + (boxW-fit.w)/2, oy = y + 3 + ((boxH-14)-fit.h)/2;
              try{ doc.addImage(dataUrl, 'JPEG', ox, oy, fit.w, fit.h); }catch(e){}
            }
            if(f.caption){
              doc.setFontSize(7.5); doc.setTextColor(muted[0],muted[1],muted[2]); doc.setFont('helvetica','italic');
              const cap = doc.splitTextToSize(f.caption, boxW-6);
              doc.text(cap[0]||'', bx+3, y+boxH-4);
            }
          });
          y += boxH + 8;
        }
        y += 4;
      });
    });

    /* ---- numeración de páginas ---- */
    const total = doc.internal.getNumberOfPages();
    for(let p=1;p<=total;p++){
      doc.setPage(p);
      doc.setFontSize(8.5); doc.setTextColor(150,150,150); doc.setFont('helvetica','normal');
      doc.text('Página '+p+' de '+total, PW-M, PH-8, {align:'right'});
    }

    const safeName = (m.cliente||'informe').replace(/[^a-z0-9áéíóúñ ]/gi,'').trim().replace(/\s+/g,'_') || 'informe';
    const filename = 'Informe_Siniestro_'+safeName+'_'+(m.fecha||todayISO())+'.pdf';
    return { doc, filename };
  }
}

async function generarPDF(){
  await persistCurrent();
  showLoading(true, 'Generando informe PDF…');
  try{
    const { doc, filename } = await buildPDFDoc();
    doc.save(filename);
    showLoading(false);
    toast('Informe PDF generado ✓');
  }catch(err){
    showLoading(false);
    toast('No se pudo cargar el motor de PDF. Revisa tu conexión a internet e inténtalo de nuevo.');
    console.error(err);
  }
}

/* ---------- eventos globales ---------- */
let boundOnce = false;
function bindGlobalEvents(){
  if(boundOnce) return;
  boundOnce = true;

  app.addEventListener('input', e=>{
    if(e.target.matches('[data-meta-field],[data-recinto-field],[data-dano-field],[data-foto-caption]')) handleFieldEvent(e);
    if(e.target.matches('[data-recinto-field="largo"],[data-recinto-field="ancho"],[data-recinto-field="alto"]')) updateAreaDisplay(e.target.dataset.recintoId);
  });
  app.addEventListener('change', e=>{
    if(e.target.matches('[data-meta-field],[data-recinto-field],[data-dano-field]')){
      handleFieldEvent(e);
      if(e.target.dataset.metaField==='tipoPropiedad') render();
    }
  });

  app.addEventListener('click', e=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    switch(action){
      case 'new-inspection': createInspection(); break;
      case 'open': openInspection(btn.dataset.id); break;
      case 'duplicate': duplicateInspection(btn.dataset.id); break;
      case 'delete': deleteInspection(btn.dataset.id); break;
      case 'back-list': persistCurrent().then(openList); break;
      case 'back-list-from-modal': closeFinalizeModal(); persistCurrent().then(openList); break;
      case 'delete-current': deleteInspection(current.id).then(openList); break;
      case 'gen-pdf': generarPDF(); break;
      case 'finalize': finalizeInspection(); break;
      case 'open-settings': openSettings(); break;
      case 'close-settings': closeSettings(); break;
      case 'save-settings': saveSettingsForm(); break;
      case 'close-finalize-modal': closeFinalizeModal(); break;
      case 'add-recinto-input': {
        const input = document.getElementById('newRecintoInput');
        addRecinto(input.value);
        break;
      }
      case 'add-recinto-input-bottom': {
        const input = document.getElementById('newRecintoInputBottom');
        addRecinto(input.value);
        break;
      }
      case 'add-recinto-preset': addRecinto(btn.dataset.name); break;
      case 'toggle-recinto': toggleRecinto(btn.dataset.rid); break;
      case 'remove-recinto': removeRecinto(btn.dataset.rid); break;
      case 'scroll-top': window.scrollTo({top:0, behavior:'smooth'}); break;
      case 'add-dano': addDano(btn.dataset.rid); break;
      case 'remove-dano': removeDano(btn.dataset.rid, btn.dataset.did); break;
      case 'remove-photo': removeFoto(btn.dataset.rid, btn.dataset.did, btn.dataset.fid); break;
      case 'open-camera': openCamera(btn.dataset.rid, btn.dataset.did); break;
    }
  });

  app.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.target.id==='newRecintoInput' || e.target.id==='newRecintoInputBottom')){
      e.preventDefault(); addRecinto(e.target.value);
    }
  });

  app.addEventListener('change', e=>{
    if(e.target.matches('[data-photo-input]')){
      const files = Array.from(e.target.files||[]);
      const rid = e.target.dataset.rid, did = e.target.dataset.did;
      e.target.value = '';
      if(files.length>0) handleFiles(rid, did, files);
    }
  });

  // controles de la cámara embebida: el overlay vive en document.body (fuera
  // de #app), así que necesita su propio listener en vez de depender del
  // delegado en #app.
  document.addEventListener('click', e=>{
    const btn = e.target.closest('[data-cam-action]');
    if(!btn) return;
    switch(btn.dataset.camAction){
      case 'shoot': shootCameraPhoto(); break;
      case 'flip': flipCameraFacing(); break;
      case 'close': closeCameraOverlay(); break;
      case 'done': closeCameraOverlay(); break;
    }
  });
}

/* ---------- evitar pérdida de datos al cerrar la app o cambiar de pestaña ---------- */
window.addEventListener('beforeunload', ()=>{
  if(dirty && current){
    clearTimeout(saveTimer);
    persistCurrent();
  }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && dirty && current){
    clearTimeout(saveTimer);
    persistCurrent();
  }
});

/* ---------- botón "atrás" del teléfono/navegador ----------
   Al entrar a una inspección se agrega una entrada al historial. Así, si el
   usuario presiona el botón físico de "atrás" estando dentro de la
   inspección, en vez de cerrar la pestaña/app, se dispara "popstate": se
   guarda lo pendiente y se vuelve a la pantalla de "Mis informes". */
window.addEventListener('popstate', ()=>{
  if(view==='editor'){
    clearTimeout(saveTimer);
    persistCurrent().then(openList);
  }
});

/* ---------- PWA: registro del service worker (instalable + offline) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{
      // Si falla (ej. abierta como archivo local sin servidor), la app sigue
      // funcionando igual gracias a IndexedDB; solo no quedará "instalable".
    });
  });
}

/* ---------- init ---------- */
(async function init(){
  try{ history.replaceState({view:'list'}, '', ''); }catch(e){}
  app.innerHTML = '<div style="padding:60px;text-align:center;color:#69737F;font-family:IBM Plex Mono, monospace;">Cargando Compensación Seguros…</div>';
  await loadIndex();
  render();
})();
</script>
</body>
